services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lomi
      POSTGRES_PASSWORD: lomi
      POSTGRES_DB: lomi
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lomi -d lomi"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://lomi:lomi@postgres:5432/lomi?schema=public
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /app/storage/uploads
      API_PORT: 3001
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3001}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      RUN_MODE: api
    ports:
      - "3001:3001"
    volumes:
      - ./storage/uploads:/app/storage/uploads
      - ./fixtures:/app/fixtures:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://lomi:lomi@postgres:5432/lomi?schema=public
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /app/storage/uploads
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      RUN_MODE: worker
    volumes:
      - ./storage/uploads:/app/storage/uploads
      - ./fixtures:/app/fixtures:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
